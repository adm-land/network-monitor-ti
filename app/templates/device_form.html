{% extends 'base.html' %}{% block title %}Nuevo dispositivo | Network Monitor TI{% endblock %}{% block content %}<section class="form-card wide"><p class="eyebrow">NUEVO DISPOSITIVO</p><h1>Agregar equipo al monitoreo</h1><form method="post" class="form grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre<input name="name" required></label><label>Tipo<select name="device_type" required>{% for t in device_types %}<option>{{ t }}</option>{% endfor %}</select></label><label>IP o hostname<input name="host" placeholder="192.168.10.1" required></label><label>Puerto TCP<input type="number" min="1" max="65535" name="port" value="443" required></label><label>Dirección MAC<input name="mac_address" placeholder="00:1A:2B:3C:4D:5E"></label><label>Fabricante<input name="vendor" placeholder="Cisco, Dell, HP..."></label><label>Modelo<input name="model"></label><label>Ubicación<input name="location" placeholder="Rack 01, Piso 2..." required></label>{% if config.MONITOR_MODE == 'demo' %}<label>Comportamiento demo<select name="demo_profile"><option value="online">En línea</option><option value="slow">Latencia alta</option><option value="offline">Fuera de línea</option></select></label>{% endif %}<label class="full">Notas<textarea name="notes" rows="4"></textarea></label><div class="full actions"><button class="btn">Guardar dispositivo</button><a class="btn secondary" href="{{ url_for('main.devices') }}">Cancelar</a></div></form></section>{% endblock %}
