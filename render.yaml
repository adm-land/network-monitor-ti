services:
  - type: web
    name: network-monitor-ti-alan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: APP_ENV
        value: production
      - key: MONITOR_MODE
        value: demo
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/network_monitor.db
